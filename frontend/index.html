<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Times</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>Times Legends</h1>
        <p class="subtitle">Consumindo nossa própria API em Node.js</p>

        <div class="time-area">
            <img src="" alt="time" id="TimeImage">
            <div id="breedName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">Time Aleatorio</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="breedInput"
                placeholder="Digite nomes de Times (ex: Santos, Flamengo)"
            >
            <button id="searchBtn">Buscar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
